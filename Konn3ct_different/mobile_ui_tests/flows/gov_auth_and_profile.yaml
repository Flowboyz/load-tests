- tapOn:
    id: "login-button"
    optional: true
- tapOn:
    text: "Login"
    optional: true
- tapOn:
    point: "50%,64%"
    optional: true
- assertVisible:
    id: "host-meeting-btn"
    optional: true
- tapOn:
    text: "Profile"
    optional: true
- tapOn:
    point: "85%,95%"
    optional: true
- evalScript: "java.lang.Thread.sleep(2000)"
- assertVisible:
    id: "edit-profile-btn"
    optional: true
- evalScript: "java.lang.Thread.sleep(1500)"
- tapOn:
    text: "More"
    optional: true
- tapOn:
    point: "95%,95%"
    optional: true
- evalScript: "java.lang.Thread.sleep(2000)"
- scrollUntilVisible:
